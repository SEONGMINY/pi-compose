<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 284" role="img" aria-labelledby="title desc">
<title id="title">Pi Compose launched a separate tmux session and kept the Main session</title>
<desc id="desc">A shortened and arranged transcription of two separate outputs captured on macOS after Independent Shared launch. Main Pi reports launch command succeeded but agent readiness unverified. Tmux lists docs-main and pc-documentation-resear-28140cc6. No provider credentials were available, so real model work was not verified.</desc>
<rect width="940" height="284" rx="16" fill="#101827"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
<rect x="17" y="17" width="581" height="218" rx="10" fill="#1d293b" stroke="#43526c"/>
<circle cx="37" cy="35" r="5" fill="#e26c67"/><circle cx="54" cy="35" r="5" fill="#e5be57"/><circle cx="71" cy="35" r="5" fill="#63c58d"/>
<text x="88" y="40" fill="#b7c9e2" font-size="15">Pi Main · after /compose launch</text>
<line x1="29" y1="53" x2="585" y2="53" stroke="#41506a"/>
<text x="33" y="88" fill="#e2e8f0" font-size="16">Launch command completed</text>
<text x="33" y="115" fill="#88d8a9" font-size="15">(launch_command_succeeded_agent_unverified)</text>
<text x="33" y="151" fill="#e2e8f0" font-size="16">shared</text>
<text x="33" y="183" fill="#f7ca7d" font-size="15">Agent readiness unverified.</text>
<text x="33" y="216" fill="#aebbd0" font-size="14">Main TUI remains open</text>
<rect x="613" y="17" width="310" height="218" rx="10" fill="#1d293b" stroke="#43526c"/>
<circle cx="633" cy="35" r="5" fill="#e26c67"/><circle cx="650" cy="35" r="5" fill="#e5be57"/><circle cx="667" cy="35" r="5" fill="#63c58d"/>
<text x="684" y="40" fill="#b7c9e2" font-size="14">tmux list-sessions</text>
<line x1="625" y1="53" x2="911" y2="53" stroke="#41506a"/>
<text x="629" y="88" fill="#e2e8f0" font-size="15">docs-main</text>
<text x="629" y="113" fill="#88d8a9" font-size="15">pc-documentation-</text>
<text x="629" y="134" fill="#88d8a9" font-size="15">resear-28140cc6</text>
<text x="629" y="182" fill="#e2e8f0" font-size="15">MAIN_ALIVE</text>
