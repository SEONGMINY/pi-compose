name: One-time README real journey evidence
on:
  push:
    paths:
      - .github/workflows/one-time-readme-journey.yml
permissions:
  contents: read
jobs:
  journey:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install from current source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install.sh
          pic --version
          workmux --version
      - name: Reproduce Main and Independent Shared launch from actual TUI
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          echo "DOCS_DEMO=$d"
          mkdir -p "$d/member-api"
          cd "$d/member-api"
          git init -q -b main
          git -c user.name=Docs -c user.email=docs@example.invalid commit -qm initial --allow-empty
          export TERM=xterm-256color
          tmux new-session -d -x 110 -y 34 -s docs-main -c "$PWD" pic
          sleep 5
          tmux send-keys -t docs-main -l '/compose launch documentation-research'
          tmux send-keys -t docs-main Enter
          sleep 2
          tmux send-keys -t docs-main Down Enter
          sleep 1
          tmux send-keys -t docs-main Enter
          sleep 5
          echo '=== ACTUAL_MAIN_TUI_AFTER_LAUNCH ==='
          tmux capture-pane -p -J -t docs-main | tail -n 30
          echo '=== TMUX_SESSIONS_AFTER_LAUNCH ==='
          tmux list-sessions -F '#{session_name}|#{session_windows}|#{session_attached}'
          echo '=== ACTUAL_LAUNCHED_WORKER_PANE ==='
          worker="$(tmux list-sessions -F '#{session_name}' | grep '^pc-documentation-rese' | head -1 || :)"
          echo "WORKER=$worker"
          if [ -n "$worker" ]; then
            tmux capture-pane -p -J -t "$worker" | tail -n 24
          fi
          echo '=== MAIN_PANE_ALIVE ==='
          tmux has-session -t docs-main && echo MAIN_ALIVE
          echo '=== ATTEMPT_BACK_UI ==='
          tmux send-keys -t docs-main -l '/compose back'
          tmux send-keys -t docs-main Enter
          sleep 3
          tmux capture-pane -p -J -t docs-main | tail -n 23
          echo '=== END_JOURNEY ==='
          tmux kill-server || true
      - name: Verify known CLI launch path and Git Worktree integration without a model
        shell: bash
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          mkdir -p "$d/app"
          cd "$d/app"
          git init -q -b main
          git -c user.name=Docs -c user.email=docs@example.invalid commit -qm initial --allow-empty
          export TERM=xterm-256color
          tmux new-session -d -s docs-worktree -c "$PWD" 'sleep 180'
          tmux new-window -t docs-worktree -n launch -c "$PWD" "node '$GITHUB_WORKSPACE/bin/pi-compose.ts' launch --context independent --workspace worktree --task 'review docs' --branch feat/docs-research; sleep 10"
          sleep 6
          echo '=== WORKTREES ==='
          git worktree list --porcelain
          echo '=== WORKMUX LIST ==='
          workmux list --json || true
          echo '=== ACTUAL_LAUNCH_PANE ==='
          tmux capture-pane -p -J -t docs-worktree:launch | tail -n 22
          tmux kill-server || true
