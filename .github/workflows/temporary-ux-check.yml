name: Temporary Pi Compose UX verification
on:
  push:
    branches:
      - feat/main-focused-tui-navigation
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --no-audit --no-fund
      - run: node --check bin/pic.mjs
      - run: npm run check

      - name: Interactive pic tmux entry smoke (isolated runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          mkdir -p "$RUNNER_TEMP/fake-pi"
          cat > "$RUNNER_TEMP/fake-pi/pi" <<'EOF'
          #!/usr/bin/env sh
          printf 'tmux=%s cwd=%s\n' "${TMUX:+yes}" "$PWD" >> "$PIC_SMOKE_LOG"
          EOF
          chmod +x "$RUNNER_TEMP/fake-pi/pi"
          export PIC_SMOKE_LOG="$RUNNER_TEMP/pi-smoke.log"
          export PATH="$RUNNER_TEMP/fake-pi:$PATH"
          export TERM=xterm-256color
          script -q -c "node bin/pic.mjs" /dev/null
          grep -q "tmux=yes cwd=$GITHUB_WORKSPACE" "$PIC_SMOKE_LOG"
          tmux kill-server || true
