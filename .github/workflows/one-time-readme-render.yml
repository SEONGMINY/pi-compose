name: One-time rendered README light dark inspection
on:
  push:
    paths:
      - .github/workflows/one-time-readme-render.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown, linked assets and rendered GitHub HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          doc=Path('README.md').read_text()
          paths=[]
          for match in re.finditer(r'(?<!!)\]\(([^)]+)\)|!\[[^\]]*\]\(([^)]+)\)',doc):
              u=(match.group(1) or match.group(2)).split('#')[0]
              if u and not u.startswith(('http://','https://')):
                  paths.append(u)
          bad=[x for x in paths if not Path(x).is_file()]
          assert not bad,bad
          assert doc.count('```')%2==0
          ET.parse('docs/assets/compose-after-launch.svg')
          print('LOCAL_LINKS_SVG_FENCES_PASS',len(paths))
          PY
          curl --fail --retry 3 --silent --show-error -L https://github.com/SEONGMINY/pi-compose -o /tmp/github-readme.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/github-readme.html').read_text()
          indicators=['markdown-body','Keep the reasoning','compose-after-launch.svg','curl -fsSL','readme-journey.md']
          for item in indicators:
              print('RENDER',item,'PRESENT' if item in s else 'MISSING')
          assert all(item in s for item in indicators)
          print('GITHUB_HTML_RENDER_PASS')
          PY
      - name: Browser verify first viewport in light and dark
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund puppeteer-core@24
          which google-chrome || which google-chrome-stable || which chromium
          export NODE_PATH="$(npm root -g)"
          node <<'JS'
          const puppeteer = require('puppeteer-core');
          (async ()=>{
            const b=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage();await p.setViewport({width:1380,height:950,deviceScaleFactor:1});
            await p.goto('https://github.com/SEONGMINY/pi-compose',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForSelector('img[src*="compose-after-launch.svg"]',{timeout:30000});
            for(const theme of ['light','dark']){
              await p.evaluate(theme=>{document.documentElement.setAttribute('data-color-mode',theme);document.documentElement.setAttribute('data-light-theme','light');document.documentElement.setAttribute('data-dark-theme','dark')},theme);
              await new Promise(r=>setTimeout(r,1000));
              const out=await p.evaluate(()=>{
                const img=document.querySelector('img[src*="compose-after-launch.svg"]');
                const r=img.getBoundingClientRect();
                const article=document.querySelector('article')||document.querySelector('.markdown-body');
                return {naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,width:Math.round(r.width),height:Math.round(r.height),top:Math.round(r.top),topWithinReadme:article?Math.round(r.top-article.getBoundingClientRect().top):null,isVisible:r.width>500&&r.height>100,markdown:!!article,headings:[...document.querySelectorAll('h1,h2')].slice(0,10).map(x=>x.textContent.trim())};
              });
              console.log('CHROME_RENDER',theme,JSON.stringify(out));
              if(!out.isVisible||out.naturalWidth<250||out.topWithinReadme===null||out.topWithinReadme<0||out.topWithinReadme>600)throw Error('Hero image not rendered as a usable early README visual');
              await p.screenshot({path:'/tmp/readme-'+theme+'.png',fullPage:true});
            }
            await b.close(); console.log('LIGHT_DARK_BROWSER_RENDER_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
