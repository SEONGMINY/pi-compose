name: Pi Compose PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/pic-direct-main-handoff-20261109, feat/policy-sync-work-owned-handoff-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and tests
        run: npm run check
