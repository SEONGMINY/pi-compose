name: Phase 6 one-time integration smoke
on:
  push:
    paths:
      - .github/workflows/phase6-smoke.yml
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install isolated runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          npm install --ignore-scripts --no-audit --no-fund
          npm install -g --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          curl -fsSL https://raw.githubusercontent.com/raine/workmux/main/scripts/install.sh -o /tmp/install-workmux.sh
          mkdir -p "$HOME/.local/bin"
          WORKMUX_VERSION=v0.1.277 WORKMUX_INSTALL_DIR="$HOME/.local/bin" bash /tmp/install-workmux.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Installed versions
        run: |
          node --version
          pi --version
          tmux -V
          workmux --version
      - name: Strict TypeScript check
        continue-on-error: true
        run: npm run typecheck
      - name: Extension-focused tests
        continue-on-error: true
        run: npm test
      - name: CLI and real Pi/workmux startup smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          git config --global user.email phase6@example.invalid
          git config --global user.name "Phase 6 Smoke"
          root="$(mktemp -d)"
          trap 'tmux kill-server >/dev/null 2>&1 || true; rm -rf "$root"' EXIT
          mkdir -p "$root/project"
          cd "$root/project"
          git init -q -b main
          git commit --allow-empty -qm initial
          source="$(pwd)"
          # Run dry-run on the real source under actual runtime dependencies.
          node "$GITHUB_WORKSPACE/bin/pi-compose.ts" launch --context independent --workspace shared --task "dummy" --cwd "$source" --dry-run
          node "$GITHUB_WORKSPACE/bin/pi-compose.ts" launch --context independent --workspace worktree --task "dummy" --branch feat/smoke --cwd "$source" --dry-run
          # Pi's actual runtime and extensions load without invoking a paid model API.
          pi --help >/dev/null
          tmux new-session -d -s pc-smoke -c "$source" "pi --extension '$GITHUB_WORKSPACE/extensions/compose.ts'"
          sleep 4
          tmux has-session -t pc-smoke
          tmux capture-pane -p -t pc-smoke | tail -n 18
          echo PI_TMUX_TUI_STARTED
          # Verify exact tool version; no user branch/Worktree is touched.
          workmux --help >/dev/null
          echo WORKMUX_CLI_AVAILABLE

      - name: Actual Shared Launch, exact Resume and workmux Worktree provisioning
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export TERM=xterm-256color
          git config --global user.email phase6@example.invalid
          git config --global user.name "Phase 6 Smoke"
          root="$(mktemp -d)"
          trap 'tmux kill-server >/dev/null 2>&1 || true; rm -rf "$root"' EXIT
          mkdir -p "$root/project"
          cd "$root/project"
          git init -q -b main
          git commit --allow-empty -qm initial
          echo 'Phase 6 exact session fixture' > AGENTS.md
          printf '{"type":"session","version":3,"id":"phase6-exact","timestamp":"2026-10-25T09:00:00.000Z","cwd":"%s"}\n' "$PWD" > "$root/source.jsonl"
          # This really creates a tmux target and starts an actual Pi process, without model credentials.
          node "$GITHUB_WORKSPACE/bin/pi-compose.ts" launch --context independent --workspace shared --task "Phase6 startup" --cwd "$PWD" > "$root/shared.json"
          target="$(node -pe "JSON.parse(require('fs').readFileSync('$root/shared.json','utf8')).tmuxTarget")"
          tmux has-session -t "$target"
          echo "SHARED_LAUNCH_CREATED_TMUX=$target"
          # Inspect exact saved session and let the real Pi CLI parse the file.
          node "$GITHUB_WORKSPACE/bin/pi-compose.ts" resume --workspace shared --cwd "$PWD" --session-file "$root/source.jsonl" > "$root/resume.json"
          resume_target="$(node -pe "JSON.parse(require('fs').readFileSync('$root/resume.json','utf8')).tmuxTarget")"
          tmux has-session -t "$resume_target"
          echo "EXACT_RESUME_STARTED=$resume_target"
          # Repeating the resume must NEVER create another Pi process.
          node "$GITHUB_WORKSPACE/bin/pi-compose.ts" resume --workspace shared --cwd "$PWD" --session-file "$root/source.jsonl" > "$root/retry.json"
          grep -q 'target_occupied_no_launch' "$root/retry.json"
          echo "REPEAT_RESUME_BLOCKED=pass"
          # Actual workmux integration, from a new isolated Git repository only.
          tmux new-session -d -s phase6-parent -c "$PWD"
          # workmux resolves its parent tmux session from the running pane, as in actual Pi usage.
          command="node '$GITHUB_WORKSPACE/bin/pi-compose.ts' launch --context independent --workspace worktree --task 'Phase6 test' --cwd '$PWD' --branch feat/phase6 > '$root/worktree.json' 2> '$root/worktree.err'; echo \\$? > '$root/worktree.exit'"
          tmux send-keys -t phase6-parent "$command" C-m
          for attempt in $(seq 1 35); do
            test -f "$root/worktree.exit" && break
            sleep 1
          done
          if ! test -f "$root/worktree.exit" || ! grep -q '^0$' "$root/worktree.exit"; then
            echo WORKMUX_ACTUAL_LAUNCH_FAILED
            cat "$root/worktree.err" 2>/dev/null || true
            exit 1
          fi
          node "$GITHUB_WORKSPACE/bin/pi-compose.ts" inspect --cwd "$PWD" --branch feat/phase6 > "$root/inspect.json"
          grep -q '"status": "worktree-existing"' "$root/inspect.json"
          echo "ACTUAL_WORKMUX_WORKTREE_LAUNCH=pass"
