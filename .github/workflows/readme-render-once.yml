name: One-time GitHub README HTML rendering check
on:
  push:
    paths:
      - .github/workflows/readme-render-once.yml
permissions:
  contents: read
jobs:
  verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Fetch actual rendered GitHub repository page
        run: |
          set -euo pipefail
          curl --retry 2 --retry-delay 2 --fail --silent --show-error -L \
            -H 'User-Agent: Mozilla/5.0' \
            https://github.com/SEONGMINY/pi-compose -o /tmp/github-page.html
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          html = Path('/tmp/github-page.html').read_text()
          checks = {
              "GitHub markdown body": "markdown-body" in html,
              "README intro": "Keep the reasoning" in html,
              "Context-picker asset": "compose-context-picker.svg" in html,
              "Workspace-picker asset": "compose-workspace-picker.svg" in html,
              "Installation command": "install.sh" in html,
              "Pi attribution": "earendil-works/pi" in html,
          }
          for label, result in checks.items():
              print(f"{label}: {'PASS' if result else 'FAIL'}")
          if not all(checks.values()):
              raise SystemExit(1)
          print("ACTUAL_GITHUB_README_HTML_RENDER_PASS")
          PY
      - name: Check GitHub raw image responses
        run: |
          set -euo pipefail
          for asset in compose-context-picker compose-workspace-picker; do
            curl --retry 2 --fail --silent --show-error -L \
              "https://raw.githubusercontent.com/SEONGMINY/pi-compose/main/docs/assets/$asset.svg" \
              -o "/tmp/$asset.svg"
            python3 -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/$asset.svg')"
            echo "RAW_SVG_OK $asset"
          done
